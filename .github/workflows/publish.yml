name: Publish to ComfyUI Registry

on:
  push:
    branches:
      - master
    paths:
      - "pyproject.toml"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Comfy-Org/publish-node-action@d2366e7abb6ab16f3bb03e3520ae25c8cf749bc9 # main
        with:
          personal_access_token: ${{ secrets.COMFYREGISTRY }}
